critical_scenarios:
  - id: CS-1
    name: "Внешний → внутренний через агент"
    chain: "Вредоносная страница → браузер администратора шлёт POST /api/jobs на агент (CORS *, без auth) → запуск сканирования/бэкапа"
    closes: [T-22, "A-1", "A-2"]
  - id: CS-2
    name: "Открытая регистрация → AI"
    chain: "Регистрация постороннего (T-03) → prompt injection в поле записи (T-27) → мутации агентом с широкими инструментами"
    closes: [T-03, T-27, T-28]
  - id: CS-3
    name: "Автор шаблона → внутренняя сеть"
    chain: "inlineRemote/http на внутренний адрес (T-14) → чтение данных внутренних систем"
    closes: [T-14]
  - id: CS-4
    name: "Кража общего секрета агентов"
    chain: "Утечка AGENT_SHARED_SECRET (T-04) → год работы токена сервисного пользователя (T-23)"
    closes: [T-04, T-23]

operator_next_steps:
  - Определить объект оценки и класс/категорию защищённости (classification)
  - Для каждой угрозы сопоставить записи БДУ ФСТЭК (поле bdu) и оценить негативные последствия для своих процессов
  - Исключить неактуальные угрозы с обоснованием, утвердить перечень актуальных угроз
  - Адаптировать меры приказа № 239 (или профиль ИСПДн/ГИС), назначить компенсирующие меры по рекомендациям угроз
  - Переоценивать модель при изменении архитектуры, подключении новых агентов или версий
