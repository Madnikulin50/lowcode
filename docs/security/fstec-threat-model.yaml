    scenario: "Эксплуатация уязвимости парсера PDF/CAD на файле пользователя"
    existing_measures: ["аргументы без shell"]
    residual_risk: С
    recommendation: "запуск под отдельной непривилегированной учётной записью, ограничение ресурсов"
