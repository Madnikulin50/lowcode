# Модель угроз безопасности информации платформы lowcode
# Машиночитаемое представление документа docs/security/threat-model.md.
# Форма — исходные данные для модели угроз оператора (Методика оценки угроз
# ФСТЭК 05.02.2021, приказы ФСТЭК № 17, № 21, № 239, БДУ ФСТЭК).
# Кодировка: UTF-8. Поля, которые должен заполнить оператор, помечены "operator_fill".

meta:
  title: Модель угроз безопасности информации платформы lowcode
  version: "2026-11-14"
  branch: "2026.10.x"
  source_doc: docs/security/threat-model.md
  machine_doc: docs/security/fstec-threat-model.yaml
  related:
    - docs/security/attack-surface.md
    - docs/security/fstec-attack-surface.yaml
    - docs/security/fstec-tables.md
    - docs/security/kii-categorization.md
    - SECURITY_AUDIT_FSTEC.md
  methodology:
    - Методика оценки угроз безопасности информации ФСТЭК России (05.02.2021)
    - Приказ ФСТЭК России от 18.02.2013 № 21
    - Приказ ФСТЭК России от 11.02.2013 № 17
    - Приказ ФСТЭК России от 25.12.2017 № 239
    - Банк данных угроз (БДУ) ФСТЭК
    - STRIDE / CWE (систематизация технических угроз)

# Классификация объекта — заполняется оператором при внедрении
classification:
  object_type: null            # ИСПДн / ГИС / КИИ / АСУ ТП (operator_fill)
  protection_class: null       # для ИСПДн: 1З..3З, 1УЗ..3УЗ (operator_fill)
  significance_category: null  # для КИИ: 1 / 2 / 3 категория (operator_fill)
  category_basis: null         # обоснование категории/класса (operator_fill)

system:
  name: Платформа lowcode
  vendor: Собственная разработка (форк Corteza)
  purpose: >
    Low-code платформа для сборки бизнес-приложений без отдельного бэкенда:
    Compose-приложения (модули, страницы, графики), workflow, rule chains,
    вычислительные агенты (backup, cmdb, invest, стройконтроль), AI-чат,
    MCP-сервер для внешних LLM-клиентов.
  scope_in:
    - server/ (монолитный бэкенд Go)
    - client3/ (7 SPA на Vue 3)
    - agents/ (продуктовые агенты и скиллы)
    - docker-conf/ (конфигурация развёртывания, переменные окружения)
    - Интеграции LLM (Ollama), MCP, IdP (SAML/OIDC), СУБД, объектные хранилища
  scope_out:
    - Инфраструктура оператора (сеть, ОС, гипервизор, СЗИ периметра)
    - Организационные процессы, физическая защита
    - Приложения заказчика, собранные на платформе (модули, страницы, workflow)
  deployment_assumptions:
    - Сервер публикуется только через обратный прокси/шлюз с TLS; прямого доступа к портам агентов, MCP, Corredor, СУБД, MinIO, Ollama из недоверенных сетей нет
    - Администраторы платформы и ОС доверенные; доступ к .env и секретам ограничен
    - Резервные копии шифруются и хранятся отдельно
    - LLM работает в контуре оператора (локальный Ollama), данные не уходят в публичные облака без отдельного согласования

assets:
  - {id: AS1,  name: Данные записей Compose (бизнес-данные, ПДн), properties: [К, Ц, Д], storage: "СУБД (DAL), хранилище файлов"}
  - {id: AS2,  name: "Учётные данные и секреты (пароли bcrypt, TOTP, токены, AUTH_SECRET, AGENT_SHARED_SECRET, ключи MinIO/SMTP/LLM)", properties: [К, Ц], storage: "СУБД, окружение, .env"}
  - {id: AS3,  name: Токены доступа и сессии (JWT, cookie), подписанные URL, properties: [К, Ц], storage: "клиент, сервер"}
  - {id: AS4,  name: "Конфигурация приложений (модули, страницы, workflow, цепочки, промпты, навыки, скрипты)", properties: [Ц, Д], storage: СУБД}
  - {id: AS5,  name: Права доступа (RBAC-правила, роли), properties: [Ц], storage: СУБД}
  - {id: AS6,  name: "Журналы аудита (actionlog), трассировка AI-шагов", properties: [Ц, Д], storage: "СУБД, файлы"}
  - {id: AS7,  name: Вложения и резервные копии, properties: [К, Ц, Д], storage: "FS, MinIO/S3"}
  - {id: AS8,  name: Сервис платформы (доступность API, workflow, агенты), properties: [Д], storage: процессы}
  - {id: AS9,  name: Исполняемая среда (ОС, контейнеры, зависимости, образы), properties: [Ц], storage: "хост, реестр образов"}
  - {id: AS10, name: Модели и промпты LLM, properties: [Ц], storage: "Ollama, СУБД"}

trust_boundaries:
  - {id: TB1, boundary: "Интернет/сеть пользователей → сервер", crosses: "запросы, файлы, учётные данные", controls: "TLS на прокси, аутентификация, CSRF, rate-limit токенов"}
  - {id: TB2, boundary: "Внешние системы → сервер", crosses: "вызовы sink, REST интеграций, SCIM", controls: "подпись URL sink, секрет SCIM, OAuth2-клиенты"}
  - {id: TB3, boundary: "LLM-клиент → MCP", crosses: "вызовы инструментов", controls: "нет аутентификации на транспорте SSE (находка T-32)"}
  - {id: TB4, boundary: "Сервер → агент", crosses: "команды запуска операций", controls: "нет аутентификации у агента, CORS * (находки A-1, A-2)"}
  - {id: TB5, boundary: "Агент → сервер", crosses: "чтение/запись записей", controls: "JWT identity corteza-service (365 дней)"}
  - {id: TB6, boundary: "Сервер → Corredor", crosses: скрипты, controls: сеть}
  - {id: TB7, boundary: "Сервер → LLM", crosses: "контекст, содержимое записей", controls: сеть}
  - {id: TB8, boundary: "Сервер → СУБД", crosses: SQL, controls: "учётная запись СУБД"}
  - {id: TB9, boundary: "Сервер → файловые хранилища", crosses: файлы, controls: "ключи S3"}

violators:
  - {id: V1, name: Внешний анонимный пользователь, type: внешний, potential: базовый, motivation: "несанкционированный доступ, порча данных, шантаж", capabilities: "доступ к публичным маршрутам, подбор паролей, фишинг, сканирование"}
  - {id: V2, name: Зарегистрированный пользователь с низкими правами, type: внутренний, potential: "базовый повышенный", motivation: "доступ к чужим данным, повышение привилегий", capabilities: "вызовы API в рамках ролей, загрузка файлов, составление запросов"}
  - {id: V3, name: Пользователь-разработчик приложений, type: внутренний, potential: "базовый повышенный", motivation: "получение доступа к данным/инфраструктуре, упрощение работы в обход регламента", capabilities: "workflow, цепочки, шаблоны, скрипты, вызов HTTP, настройка прав на своих объектах"}
  - {id: V4, name: Администратор платформы, type: внутренний, potential: средний, motivation: "злоупотребление полномочиями, отрицание действий", capabilities: "полный доступ к настройкам и данным"}
  - {id: V5, name: Администратор инфраструктуры/СУБД, type: внутренний, potential: средний, motivation: "доступ к секретам и копиям, злоупотребление", capabilities: "доступ к хостам, секретам, резервным копиям"}
  - {id: V6, name: Скомпрометированный агент или внутренний хост, type: "внешний/внутренний", potential: "базовый повышенный", motivation: "развитие компрометации внутри контура", capabilities: "токен сервисного пользователя, доступ в сеть агентов"}
  - {id: V7, name: Поставщик ПО/зависимостей (supply chain), type: внешний, potential: "средний-высокий", motivation: "внедрение вредоносного кода, шпионаж", capabilities: "вредоносные обновления, подмена образов"}
  - {id: V8, name: Злоумышленник через AI (инъекция в данные, которые читает LLM), type: внешний, potential: базовый, motivation: "управление поведением LLM, кража данных через агента", capabilities: "вредоносный текст в записях, файлах, письмах"}
  - {id: V9, name: Целенаправленная группировка (APT), type: внешний, potential: высокий, motivation: "длительное присутствие, кража данных, саботаж", capabilities: "цепочки эксплойтов, 0-day, социальная инженерия"}

violators_notes: >
  Для значимого объекта КИИ 1–2 категории оператору следует рассматривать
  нарушителей V7 и V9; для 3 категории — как минимум V1–V6 и V8.

threats:
  - id: T-01
    name: Подбор паролей / credential stuffing
    stride: Spoofing
    violators: [V1]
    violated_properties: [К, Ц]
    surface: [N1]
    scenario: "Многократные попытки входа на /auth с подобранными/утёкшими учётными данными"
    existing_measures: [bcrypt, политика паролей, "rate-limit токенов (checkTokenRate)", "MFA (TOTP, Email OTP)", запрет повторного пароля]
    residual_risk: С
    recommendation: "обязательный MFA для администраторов; блокировка учётной записи по числу неудачных попыток"
    relevance: актуальна
    bdu: []  # operator_fill

  - id: T-02
    name: Предсказание секретов, токенов и ID сессий
    stride: Spoofing
    violators: [V1]
    violated_properties: [К, Ц]
    surface: [N1]
    scenario: "Подбор токенов сессий/секретов при слабом ГПСЧ"
    existing_measures: ["исправлено: pkg/rand и секрет TOTP на crypto/rand"]
    residual_risk: Н
    recommendation: "ротировать токены, выпущенные до исправления"
    relevance: "не актуальна (закрыта полностью)"
    bdu: []

  - id: T-03
    name: Самостоятельная регистрация посторонних учётных записей
    stride: Spoofing
    violators: [V1]
    violated_properties: [К, Ц, Д]
    surface: [N1]
    scenario: "Открытая регистрация /auth (в стандартном provision включена) позволяет создать учётную запись без участия администратора"
    existing_measures: ["подтверждение email (включается при корректных SMTP-настройках)"]
    residual_risk: "В (если регистрация открыта)"
    recommendation: "отключить auth.internal.signup.enabled в промышленной среде"
    relevance: условно-актуальна
    relevance_condition: "актуальна, если саморегистрация включена (значение по умолчанию)"
    bdu: []

  - id: T-04
    name: "Получение токена сервисного пользователя через /agents/enroll"
    stride: Elevation
    violators: [V6]
    violated_properties: [К, Ц]
    surface: [N1]
    scenario: "Кража/подбор AGENT_SHARED_SECRET → токен corteza-service на 365 дней"
    existing_measures: ["сравнение секрета за постоянное время", "маршрут монтируется только при заданном секрете"]
    residual_risk: В
    recommendation: "ограничить частоту, сократить срок токена, добавить отзыв, раздельные секреты/пользователи на агента, ротация"
    relevance: актуальна
    bdu: []

  - id: T-05
    name: Кража JWT/cookie (XSS, перехват трафика)
    stride: Spoofing
    violators: [V2]
    violated_properties: [К, Ц]
    surface: [N1, D1, D3]
    scenario: "Похищение токена доступа через XSS или перехват незашифрованного трафика"
    existing_measures: ["cookie HttpOnly/Secure", "CSRF SameSite=Strict", "v-html → v-text в CPrompt*", "HMAC-SHA256 для подписанных URL"]
    residual_risk: С
    recommendation: "CSP, ограничение времени жизни токенов, отзыв токенов"
    relevance: актуальна
    bdu: []

  - id: T-06
    name: Подмена IdP / подделка подписи SAML
    stride: Spoofing
    violators: [V9]
    violated_properties: [К, Ц]
    surface: [N1, D10]
    scenario: "Атаки на XML-подпись (XSW) при внешнем входе SAML"
    existing_measures: ["goxmldsig 1.6.0", проверка подписи]
    residual_risk: С
    recommendation: "регулярное обновление зависимости, тесты XSW"
    relevance: условно-актуальна
    relevance_condition: "актуальна, если используется внешний SAML-вход"
    bdu: []

  - id: T-07
    name: Обход RBAC через менее проверяемый путь (MCP, чат, агенты, workflow)
    stride: Elevation
    violators: [V2]
    violated_properties: [К, Ц]
    surface: [N1, N2, N3, D7]
    scenario: "Вызов мутации через MCP/чат/агента в обход привычных проверок REST"
    existing_measures: ["проверки в сервисном слое", "withAuth не подставляет привилегированного пользователя", "run-as для событий"]
    residual_risk: С
    recommendation: "регулярный тест «одно действие — все пути» для каждой мутации"
    relevance: актуальна
    bdu: []

  - id: T-08
    name: "Workflow с run-as повышенного пользователя выполняет чужие данные"
    stride: Tampering
    violators: [V3]
    violated_properties: [Ц, К]
    surface: [N1]
    scenario: "Автор workflow запускает шаги от имени привилегированного пользователя"
    existing_measures: ["run-as задаётся явно", "события AI требуют run-as"]
    residual_risk: С
    recommendation: "ограничить круг лиц, которым разрешён run-as"
    relevance: актуальна
    bdu: []

  - id: T-09
    name: Чтение чужих записей через экспорт, поиск, RAG, чат
    stride: "Information disclosure"
    violators: [V2]
    violated_properties: [К]
    surface: [N1, N2, D7]
    scenario: "Получение записей сверх прав через каналы поиска/AI"
    existing_measures: ["RBAC на модулях и полях", "инструменты чата вызывают те же сервисы с проверкой прав"]
    residual_risk: С
    recommendation: "тесты, что RAG, discovery и чат не отдают записи сверх прав пользователя"
    relevance: актуальна
    bdu: []

  - id: T-10
    name: Отрицание действий администратора
    stride: Repudiation
    violators: [V4]
    violated_properties: [Ц]
    surface: []
    scenario: "Удаление/изменение данных без следов при отсутствии аудита"
    existing_measures: ["actionlog: аутентификация, пользователи, роли, вложения, federation, automation"]
    residual_risk: Н
    recommendation: "вынос журнала во внешнее неизменяемое хранилище (SIEM), синхронизация времени"
    relevance: актуальна
    bdu: []

  - id: T-11
    name: Подмена конфигурации приложений без следа
    stride: Tampering
    violators: [V3, V4]
    violated_properties: [Ц, Д]
    surface: [N1]
    scenario: "Изменение страниц/модулей/цепочек без возможности отката"
    existing_measures: ["версионирование страниц, модулей, графиков, цепочек, workflow, промптов, навыков"]
    residual_risk: Н
    recommendation: "включить ревизии записей для критичных модулей"
    relevance: актуальна
    bdu: []

  - id: T-12
    name: SQL-инъекция
    stride: Injection
    violators: [V2]
    violated_properties: [К, Ц, Д]
    surface: [N1, D3]
    scenario: "Внедрение SQL через параметры запросов"
    existing_measures: ["goqu с параметризацией", "единственный Sprintf — миграции"]
    residual_risk: Н
    recommendation: "перевести upgrade_fixes.go:234 на плейсхолдеры"
    relevance: актуальна
    bdu: []

  - id: T-13
    name: "XSS (stored/DOM) через значения полей, комментарии, v-html"
    stride: XSS
    violators: [V2]
    violated_properties: [К, Ц]
    surface: [D1, D3]
    scenario: "Внедрение скрипта в данные, отображаемые другим пользователям"
    existing_measures: ["исправлены CPrompt*.vue", "шаблоны html/template"]
    residual_risk: С
    recommendation: "CSP; аудит оставшихся v-html в client3"
    relevance: актуальна
    bdu: []

  - id: T-14
    name: "SSRF (inlineRemote в шаблонах, http в workflow, APIGW)"
    stride: Tampering
    violators: [V3]
    violated_properties: [К]
    surface: [D6, D9, N1]
    scenario: "Исходящий запрос на внутренний адрес (loopback, приватные сети) из шаблона/workflow/APIGW"
    existing_measures: ["только http(s)", "таймаут 15 с", "лимит 10 МБ", "gotenbergPDF не принимает URL от пользователя"]
    residual_risk: "В (для V3)"
    recommendation: "блокировать приватные диапазоны/loopback для исходящих запросов по умолчанию"
    relevance: актуальна
    bdu: []

  - id: T-15
    name: "Загрузка вредоносных файлов, зипбомба, полиглот"
    stride: Tampering
    violators: [V2]
    violated_properties: [Ц, Д, К]
    surface: [D1, D2]
    scenario: "Вложение с вредоносным содержимым, обработка которого вредит серверу/клиентам"
    existing_measures: ["проверка типов", "подписанные URL", "версионирование", "библиотека imaging с известным DoS (остаточный риск)"]
    residual_risk: С
    recommendation: "антивирусная проверка, лимиты размеров, Content-Disposition: attachment для неизвестных типов"
    relevance: актуальна
    bdu: []

  - id: T-16
    name: "DoS: тела запросов без лимита, медленные клиенты, тяжёлые запросы"
    stride: "Denial of service"
    violators: [V1]
    violated_properties: [Д]
    surface: [N1, D3, N4]
    scenario: "Исчерпание ресурсов сервера неограниченными телами запросов/соединениями"
    existing_measures: ["ReadHeaderTimeout для служебных серверов"]
    residual_risk: С
    recommendation: "лимиты тел на маршрутах форм, ограничение частоты на периметре, ReadHeaderTimeout в SDK агентов"
    relevance: актуальна
    bdu: []

  - id: T-17
    name: Path traversal (../ в путях SPA и ресурсов)
    stride: Tampering
    violators: [V1]
    violated_properties: [К, Ц]
    surface: [N1]
    scenario: "Чтение файлов вне корня через не нормализованные пути"
    existing_measures: ["нормализация путей (path.Clean)"]
    residual_risk: Н
    recommendation: "-"
    relevance: "не актуальна (закрыта полностью)"
    bdu: []

  - id: T-18
    name: Раскрытие информации через тексты ошибок, версию, встроенную документацию
    stride: "Information disclosure"
    violators: [V1]
    violated_properties: [К]
    surface: [N1, N14]
    scenario: "Паники/стектрейсы, /version, /api/docs, /__routes, /debug на периметре"
    existing_measures: ["клиенту — internal server error"]
    residual_risk: С
    recommendation: "закрыть /version, /api/docs, /__routes, /debug на периметре; EnableDebugRoute не включать"
    relevance: актуальна
    bdu: []

  - id: T-19
    name: "Выход скриптов (gonec/Corredor/MCP scripts) из песочницы, RCE"
    stride: "Elevation/RCE"
    violators: [V3]
    violated_properties: [Ц, К, Д]
    surface: [D7, N2, N3]
    scenario: "Исполнение произвольного кода через скриптовые механизмы"
    existing_measures: ["MCP_ENABLE_SCRIPTS выключен по умолчанию", "белый список импортов", "узел gonec в rulesgo без runner"]
    residual_risk: "С (при выключенных скриптах — Н)"
    recommendation: "OS-изоляция (gVisor/контейнер, seccomp) при необходимости скриптов"
    relevance: условно-актуальна
    relevance_condition: "актуальна при включении MCP_ENABLE_SCRIPTS или Corredor без сетевой изоляции"
    bdu: []

  - id: T-20
    name: RCE через разбор файлов внешними процессами (pkg/rag PDF/CAD)
    stride: RCE
    violators: [V2]
    violated_properties: [Ц, К, Д]
