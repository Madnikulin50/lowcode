measures:
  # Группы мер по приказу ФСТЭК № 239; статус: implemented / partial / operator
  - {id: ИАФ, name: "Идентификация и аутентификация", platform: "bcrypt, MFA TOTP/Email OTP, политика паролей, запрет повторного пароля, SAML/OIDC, rate-limit токенов, отзыв токенов/сессий, enroll агентов", status: partial, operator: "политика учётных записей, интеграция с IdP, отключение саморегистрации, аутентификация агентов (A-1) и MCP SSE (T-32)"}
  - {id: УПД, name: "Управление доступом", platform: "RBAC на всех ресурсах, проверки в сервисном слое, run-as, разграничение по полям, чувствительность DAL", status: partial, operator: "ролевая модель организации, пересмотр прав, минимальные права сервисных пользователей агентов"}
  - {id: ОПС, name: "Ограничение программной среды", platform: "белый список импортов gonec, выключенные скрипты по умолчанию, отключённые debug-маршруты", status: operator, operator: "ограничение программной среды на хостах, политики запуска"}
  - {id: ЗНИ, name: "Защита носителей информации", platform: "—", status: operator, operator: "учёт и защита носителей и резервных копий, управление ключами restic"}
  - {id: АУД, name: "Аудит безопасности", platform: "actionlog (аутентификация, пользователи, роли, вложения, federation, automation), трассировка AI-шагов, версионирование конфигурации", status: partial, operator: "централизованный сбор и хранение (SIEM), анализ, синхронизация времени"}
  - {id: АВЗ, name: "Антивирусная защита", platform: "govulncheck, osv-scanner, gosec, staticcheck в разработке", status: operator, operator: "антивирусная защита на хостах и файловых потоках"}
  - {id: ОЦЛ, name: "Обеспечение целостности", platform: "версионирование ресурсов, ревизии записей, HMAC-подписи URL, контроль зависимостей", status: partial, operator: "контроль целостности ПО и конфигурации на хостах"}
  - {id: ОДТ, name: "Обеспечение доступности", platform: "таймауты, бюджеты AI, перезапуск сессий workflow, persist сессий", status: operator, operator: "резервирование, мониторинг, план восстановления (RTO/RPO)"}
  - {id: ЗСВ, name: "Защита среды виртуализации", platform: "—", status: operator, operator: "изоляция виртуальной/контейнерной среды (gVisor/seccomp для скриптов)"}
  - {id: ЗТС, name: "Защита технологических систем", platform: "—", status: operator, operator: "физическая защита"}
  - {id: ИНЦ, name: "Реагирование на инциденты", platform: "журналы, трассировка", status: operator, operator: "процесс реагирования на инциденты ИБ"}
  - {id: УКФ, name: "Управление конфигурацией", platform: "пиннинг части зависимостей, vendor", status: partial, operator: "управление конфигурацией, версиями, закрепление образов по digest, SBOM"}
  - {id: ЗИС, name: "Защита информационной системы", platform: "TLS-терминирование на прокси, CSRF SameSite, HttpOnly/Secure cookie, нормализация путей, лимиты шаблонов", status: partial, operator: "сегментация сети, МЭ, WAF, закрытие портов агентов и MCP, CSP, блокировка приватных адресов для SSRF"}
  - {id: НДВ, name: "Недекларированные возможности", platform: "vendor, ревизия зависимостей, статический анализ", status: operator, operator: "процедура контроля НДВ, сертификационные испытания (в т.ч. Svace)"}

