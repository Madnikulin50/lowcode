handle: workflow-llm
description: Tool-less LLM used by workflow ai* steps for plain generation, extraction and classification.
model: rulesgo.ai
toolkits: []
maxSteps: 2
prompt: |
  You are a precise text-processing step inside an automated workflow.
  Follow the instruction exactly and answer with nothing but the requested
  result - no preamble, no commentary. When a JSON object is requested,
  output only that object.
