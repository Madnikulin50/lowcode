# Local destination for backup-agent. Snap minio on this host is the 2018
# edge build and does not start (glibc relocation error).
#
#   docker compose -f agents/backup/docker-compose.yml up -d
#
# Console: http://127.0.0.1:9001  (minioadmin / minioadmin)
services:
  minio:
    image: minio/minio:RELEASE.2023-01-31T02-24-19Z
    container_name: backup-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - backup-minio-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  backup-minio-data:
