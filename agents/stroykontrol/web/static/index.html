<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сравнение ПД/РД</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1b1f24;
    --muted: #6b7280;
    --border: #e2e5e9;
    --panel: #f7f8fa;
    --accent: #2e59d9;
    --ok: #1a7f37;
    --warn: #9a6700;
    --bad: #cf222e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --fg:#e6e8eb; --muted:#9aa4af; --border:#2a2f37; --panel:#171a20; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 13px/1.4 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { padding: 12px; }
  .head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 6px; }
  .head h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .badge {
    display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600;
    background: var(--panel); border: 1px solid var(--border); color: var(--muted);
  }
  .badge.ok { color: #fff; background: var(--ok); border-color: var(--ok); }
  .badge.warn { color: #fff; background: var(--warn); border-color: var(--warn); }
  .badge.bad { color: #fff; background: var(--bad); border-color: var(--bad); }
  .badge .spin { display: inline-block; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .files { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .files b { color: var(--fg); font-weight: 600; }
  .simbar-row { display: flex; align-items: center; gap: 8px; margin: 6px 0 10px; }
  .simbar-row .simlabel { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .simbar { flex: 1; max-width: 260px; height: 8px; border-radius: 999px; background: var(--panel); border: 1px solid var(--border); overflow: hidden; }
  .simbar > div { height: 100%; border-radius: 999px; }
  .comment { color: var(--muted); margin: 4px 0 12px; }
  .mode-group { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-bottom: 4px; }
  .mode-sep { width: 1px; align-self: stretch; background: var(--border); margin: 0 4px; min-height: 26px; }
  .modes { display: flex; flex-wrap: wrap; gap: 4px; }
  .modes button {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--border); background: var(--panel); color: var(--fg);
    padding: 4px 10px; border-radius: 6px; font-size: 12px; cursor: pointer;
  }
  .modes button svg { width: 14px; height: 14px; flex: none; }
  .modes button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .mode-hint { font-size: 11.5px; color: var(--muted); margin: 4px 0 8px; }
  .toolbar-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .zoom { display: flex; align-items: center; gap: 2px; }
  .zoom button { border: 1px solid var(--border); background: var(--panel); color: var(--fg); border-radius: 6px; padding: 3px 8px; cursor: pointer; font-size: 13px; line-height: 1; }
  .zoom button:disabled { opacity: .4; cursor: default; }
  .zoom .zlevel { font-size: 11px; color: var(--muted); min-width: 38px; text-align: center; }
  .pager { display: flex; align-items: center; gap: 8px; }
  .pager button { border: 1px solid var(--border); background: var(--panel); color: var(--fg); border-radius: 6px; padding: 3px 10px; cursor: pointer; }
  .pager button:disabled { opacity: .4; cursor: default; }
  .stage { position: relative; border: 1px solid var(--border); border-radius: 8px; overflow: auto; background: var(--panel); min-height: 200px; }
  .side-by-side { display: flex; gap: 8px; }
  .side-by-side .col { flex: 1 1 0; min-width: 0; text-align: center; }
  .side-by-side img { max-width: 100%; border: 1px solid var(--border); border-radius: 4px; }
  .side-by-side .label { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .overlay-stage, .diff-stage { position: relative; display: flex; justify-content: center; }
  .overlay-stage img, .diff-stage img { max-width: 100%; display: block; }
  .overlay-stage .top { position: absolute; top: 0; left: 50%; transform: translateX(-50%); }
  .diff-stage { background: #000; }
  .diff-stage .top { position: absolute; top: 0; left: 50%; transform: translateX(-50%); mix-blend-mode: difference; }
  .opacity-row { display: flex; align-items: center; gap: 8px; margin: 8px 0; color: var(--muted); }
  .opacity-row input { flex: 1; max-width: 240px; }
  .unsupported { padding: 24px; text-align: center; color: var(--muted); }
  .text-legend { display: flex; gap: 16px; margin-bottom: 8px; font-size: 12px; }
  .text-legend .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .text-legend .swatch.del { background: rgba(207,34,46,.35); }
  .text-legend .swatch.add { background: rgba(26,127,55,.35); }
  /* Git-diff-style unified view: monospace, one <div> row per line, a
     fixed-width gutter carrying the -/+ marker, background tint on the row
     for whole-line add/del, and (for a clean 1:1 line replace) extra
     tdiff-del/tdiff-add spans *inside* the row for the changed words only —
     same idiom GitHub/GitLab use for line-level diffs. */
  /* No max-height/overflow here on purpose: this sits inside a Compose
     IFrame block with a fixed box height, and the page is already paginated
     (one page's diff at a time) — capping this box too would give it its
     own inner scrollbar nested inside the iframe's own outer one (the
     iframe already has to scroll to reach the discrepancies list below),
     i.e. exactly the "double scroll" a fixed-height nested box causes. Let
     it flow to its natural height instead, so there's one scroll region. */
  .text-diff {
    font: 12.5px/1.55 ui-monospace, "SF Mono", "Cascadia Code", Consolas, "Roboto Mono", monospace;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  }
  .tdiff-row { display: flex; }
  .tdiff-row .marker { flex: none; width: 22px; text-align: center; user-select: none; color: var(--muted); }
  .tdiff-row .content { flex: 1; min-width: 0; white-space: pre-wrap; word-break: break-word; padding: 0 10px 0 0; }
  .tdiff-row.del { background: rgba(207,34,46,.10); }
  .tdiff-row.del .marker { color: var(--bad); }
  .tdiff-row.add { background: rgba(26,127,55,.10); }
  .tdiff-row.add .marker { color: var(--ok); }
  .tdiff-row.ctx .content { color: var(--muted); }
  .tdiff-del { background: rgba(207,34,46,.35); text-decoration: line-through; border-radius: 2px; }
  .tdiff-add { background: rgba(26,127,55,.35); border-radius: 2px; }
  .tdiff-fold {
    display: flex; align-items: center; gap: 6px; padding: 3px 10px; cursor: pointer;
    color: var(--muted); font-size: 11.5px; background: var(--bg); border-top: 1px dashed var(--border); border-bottom: 1px dashed var(--border);
  }
  .tdiff-fold:hover { color: var(--fg); }
  .tdiff-match { padding: 10px; color: var(--muted); }
  .discrepancies { margin-top: 14px; }
  .discrepancies h2 { font-size: 13px; margin: 0 0 6px; }
  .disc-summary { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .disc-summary .chip {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600;
    padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border); background: var(--panel); color: var(--muted);
  }
  .disc-summary .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .disc-summary .chip.high { color: var(--bad); }
  .disc-summary .chip.medium { color: var(--warn); }
  .disc-summary .chip.low { color: var(--muted); }
  .disc { display: flex; gap: 8px; padding: 7px 8px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 4px; align-items: flex-start; }
  .disc .sev { flex: none; }
  .disc .sev.low { color: var(--muted); }
  .disc .sev.medium { color: var(--warn); }
  .disc .sev.high { color: var(--bad); font-weight: 600; }
  .disc .body { min-width: 0; }
  .disc .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 3px; }
  .disc .tag {
    display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 4px;
    background: var(--panel); border: 1px solid var(--border); color: var(--muted);
  }
  .disc .tag.src-ai { color: var(--accent); border-color: var(--accent); }
  .disc .tag.tag-page { color: var(--accent); border-color: var(--accent); font-weight: 600; }
  .disc .tag.tag-page-unavailable { color: var(--muted); border-color: var(--border); border-style: dashed; font-weight: 400; }
  .disc.clickable { cursor: pointer; }
  .disc.clickable:hover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--panel)); }
  .disc-fallback { color: var(--muted); font-style: italic; }
  .disc-note { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .empty { color: var(--muted); padding: 8px; }
  .err { color: var(--bad); padding: 12px; }
</style>
</head>
<body>
<div class="wrap" id="app">Загрузка…</div>
<script src="/vendor/jszip.min.js"></script>
<script src="/vendor/docx-preview.min.js"></script>
<script src="/vendor/html2canvas.min.js"></script>
<script>
const params = new URLSearchParams(location.search)
const recordID = params.get('recordID') || ''
const namespaceID = params.get('namespaceID') || ''
const qs = `recordID=${encodeURIComponent(recordID)}&namespaceID=${encodeURIComponent(namespaceID)}`

const STATUS_LABEL = { new: 'Новое', processing: 'В обработке', done: 'Готово', failed: 'Ошибка' }
const STATUS_CLASS = { new: '', processing: 'warn', done: 'ok', failed: 'bad' }
const STATUS_ICON = { new: '•', processing: '⏳', done: '✓', failed: '⚠' }
const SEV_ORDER = { high: 0, medium: 1, low: 2 }
const SEV_LABEL = { low: 'низкая', medium: 'средняя', high: 'высокая' }
const TYPE_LABEL = {
  content: 'содержание', numbering: 'нумерация', drawing: 'чертёж',
  missing_page: 'нет страницы', extra_page: 'лишняя страница',
}

// Small currentColor icons for the mode switcher (no icon font/CDN needed
// for four glyphs) — viewBox 0 0 16 16, stroke-based so they follow badge
// colors including the active/inverted state.
const ICONS = {
  side: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1" y="2" width="6" height="12" rx="1"/><rect x="9" y="2" width="6" height="12" rx="1"/></svg>',
  overlay: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="3" width="9" height="10" rx="1"/><rect x="5" y="3" width="9" height="10" rx="1" opacity="0.55"/></svg>',
  diff: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="6"/><path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor" stroke="none"/></svg>',
  text: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2 4h12M2 8h12M2 12h8"/></svg>',
}

// One-line explanation shown under the toolbar for whichever mode is
// selected — the button labels alone don't say what each mode is *for*.
const MODE_META = {
  side: { label: 'Рядом', hint: 'Страницы рядом друг с другом — для сопоставления вручную.' },
  overlay: { label: 'Наложение', hint: 'РД поверх ПД с регулируемой прозрачностью — заметны сдвиги и смещения.' },
  diff: { label: 'Авто-разница', hint: 'Совпадающие области гасятся в чёрный, различия остаются светлыми пятнами.' },
  text: { label: 'Текст', hint: 'Построчное сравнение, как git diff: «−» красным — строка только в ПД, «+» зелёным — только в РД.' },
}

const ZOOM_LEVELS = [50, 75, 100, 125, 150, 200]

let mode = 'side'
let page = 1
let zoomIdx = ZOOM_LEVELS.indexOf(100)
let pdPages = { supported: false, kind: 'other', pageCount: 0, images: null, texts: null }
let rdPages = { supported: false, kind: 'other', pageCount: 0, images: null, texts: null }

// DOCX has no server-side page-image concept (no LibreOffice on this host),
// so it's rendered client-side: docx-preview lays it out into paginated
// HTML (one <section class="docx"> per page), then html2canvas rasterizes
// each page into an image — same page-image abstraction the PDF side
// already gets from the server, so the rest of the viewer (side-by-side /
// overlay / diff) doesn't need to know which kind it's looking at. DXF gets
// the same client-side treatment for the same reason (no CAD rasterizer on
// this host either) — see renderDxfPages() further down.
// Recursively pulls one text "line" per paragraph/heading/list-item/table
// row out of a docx-preview page section. Plain sec.textContent would flatten
// every paragraph into one blob (browsers don't insert separators between
// block elements), which is fine for the old flowing word-diff but useless
// for a line-based git-style diff — this is what gives DOCX pages the same
// line boundaries a PDF page already gets for free from `pdftotext -layout`.
function linesFromElement (root) {
  const lines = []
  const LEAF = /^(P|LI|H[1-6])$/
  ;(function walk (node) {
    for (const child of node.children || []) {
      if (child.tagName === 'TABLE') {
        for (const tr of child.querySelectorAll('tr')) {
          lines.push(Array.from(tr.children).map(td => (td.textContent || '').trim()).join(' | '))
        }
      } else if (LEAF.test(child.tagName)) {
        lines.push((child.textContent || '').trim())
      } else {
        walk(child)
      }
    }
  })(root)
  return lines
}

async function renderDocxPages (side) {
  const res = await fetch(`/api/file?${qs}&side=${side}`)
  if (!res.ok) throw new Error('не удалось получить файл (' + res.status + ')')
  const blob = await res.blob()

  // A far-offscreen fixed position (the old approach) still grows the
  // document's scrollable area in most browsers, dragging the real viewport
  // sideways. Clip through a 0x0 overflow:hidden ancestor instead — the
  // inner host keeps its real width for layout/html2canvas, it's just not
  // visible or scrollable-to.
  const clip = document.createElement('div')
  clip.style.cssText = 'position:fixed; top:0; left:0; width:0; height:0; overflow:hidden;'
  document.body.appendChild(clip)
  const host = document.createElement('div')
  host.style.cssText = 'width:794px; background:#fff;'
  clip.appendChild(host)
  const shadow = host.attachShadow({ mode: 'open' })
  const styleHost = document.createElement('div')
  const body = document.createElement('div')
  shadow.appendChild(styleHost)
  shadow.appendChild(body)

  try {
    await window.docx.renderAsync(blob, body, styleHost, { inWrapper: true, breakPages: true, ignoreLastRenderedPageBreak: true })
    const sections = body.querySelectorAll('.docx-wrapper > section.docx')
    const images = []
    const texts = []
    for (const sec of sections) {
      const canvas = await window.html2canvas(sec, { scale: 2, backgroundColor: '#ffffff' })
      images.push(canvas.toDataURL('image/jpeg', 0.92))
      texts.push(linesFromElement(sec).join('\n'))
    }
    return { images, texts }
  } finally {
    clip.remove()
  }
}

// DXF gets the same treatment as DOCX above: no server-side rasterizer for
// CAD on this host either, so it's parsed and drawn to a <canvas> right here
// in the browser, producing one page image (a DXF's ENTITIES section is one
// model-space sheet — no multi-sheet/layout concept, unlike PDF/DOCX). Only
// straight-line geometry (LINE/LWPOLYLINE/POLYLINE), circles/arcs and
// TEXT/MTEXT labels are drawn — covers what dxfFile() in filegen.mjs
// generates and the bulk of a typical 2D чертёж's linework; splines,
// hatches, dimensions-as-blocks and inserted blocks are silently skipped
// rather than attempted badly.
const ACI_COLORS = { 1: '#e5352b', 2: '#e0c020', 3: '#37b52b', 4: '#2bb5c0', 5: '#3050d0', 6: '#c02bc0', 7: '#2a2a2a', 8: '#808080', 9: '#a8a8a8' }
const DXF_DEFAULT_STROKE = '#2a2a2a'

// Same group-code walk as extractDXFText in server/pkg/rag/parser_cad.go —
// kept as a *separate* pass (not fused with the geometry parser below) so
// the "Текст" view mode shows exactly the text the backend's own extractor
// fed into the det/AI comparison, not a reformatted version of it.
function extractDxfText (src) {
  const lines = src.replace(/\r\n/g, '\n').split('\n')
  const out = []
  let entity = ''
  let pending = ''
  const flush = () => { if (pending) { out.push(pending); pending = '' } }
  for (let i = 0; i + 1 < lines.length; i += 2) {
    const code = lines[i].trim()
    const val = lines[i + 1].trim()
    if (code === '0') { flush(); entity = val.toUpperCase(); continue }
    if (code === '1' || code === '3' || code === '4') {
      if (!val) continue
      if (entity === 'MTEXT' && pending) pending += ' ' + val
      else { flush(); pending = val }
    } else if (code === '2') {
      if (val && ['LAYER', 'TABLE', 'BLOCK', 'STYLE'].includes(entity)) out.push(entity + ': ' + val)
    } else if (code === '8') {
      if (val && ['TEXT', 'MTEXT', 'DIMENSION', 'INSERT'].includes(entity)) out.push('LAYER ' + val)
    }
  }
  flush()
  const seen = new Set()
  return out.filter(s => { const t = s.trim(); if (!t || seen.has(t)) return false; seen.add(t); return true }).join('\n')
}

// Geometry-only pass: walks the same group-code stream but only cares about
// ENTITIES-section drawables, collecting points/radius/angle/text per entity
// so drawDxfPage() below can rasterize them. Also collects the TABLES
// section's LAYER colors (name -> ACI color) along the way — entities here
// carry no explicit per-entity color (group 62), they're BYLAYER like real
// DXF exports default to, so drawDxfPage needs the layer table to know what
// color each one actually is.
function parseDxfEntities (src) {
  const lines = src.replace(/\r\n/g, '\n').split('\n')
  const DRAWABLE = new Set(['LINE', 'LWPOLYLINE', 'POLYLINE', 'CIRCLE', 'ARC', 'TEXT', 'MTEXT'])
  const entities = []
  const layerColors = {}
  let cur = null
  let curLayerDef = null
  for (let i = 0; i + 1 < lines.length; i += 2) {
    const code = lines[i].trim()
    const val = lines[i + 1].trim()
    if (code === '0') {
      if (cur && cur.pts.length) entities.push(cur)
      if (curLayerDef && curLayerDef.name) layerColors[curLayerDef.name] = curLayerDef.color
      curLayerDef = val === 'LAYER' ? { name: null, color: null } : null
      cur = DRAWABLE.has(val) ? { type: val, pts: [], layer: '0', color: null, text: '', size: null, startAngle: 0, endAngle: 360, _x: null, _y: null, _x2: null, _y2: null } : null
      continue
    }
    if (curLayerDef) {
      if (code === '2') curLayerDef.name = val
      else if (code === '62') curLayerDef.color = parseInt(val, 10)
      continue
    }
    if (!cur) continue
    switch (code) {
      case '8': cur.layer = val; break
      case '62': cur.color = parseInt(val, 10); break
      case '10': cur._x = parseFloat(val); break
      case '20':
        cur._y = parseFloat(val)
        if (cur._x != null && !isNaN(cur._x) && !isNaN(cur._y)) { cur.pts.push([cur._x, cur._y]); cur._x = null }
        break
      // A LINE's *end* point comes as group 11/21 (start is 10/20 above) —
      // without this, every LINE entity ends up with only its start point
      // and gets silently dropped by drawDxfPage's `pts.length >= 2` check.
      case '11': cur._x2 = parseFloat(val); break
      case '21':
        cur._y2 = parseFloat(val)
        if (cur._x2 != null && !isNaN(cur._x2) && !isNaN(cur._y2)) { cur.pts.push([cur._x2, cur._y2]); cur._x2 = null }
        break
      case '40': cur.size = parseFloat(val); break
      case '50': cur.startAngle = parseFloat(val); break
      case '51': cur.endAngle = parseFloat(val); break
      case '1': case '3': case '4':
        if (val) cur.text = cur.text ? cur.text + ' ' + val : val
        break
    }
  }
  if (cur && cur.pts.length) entities.push(cur)
  if (curLayerDef && curLayerDef.name) layerColors[curLayerDef.name] = curLayerDef.color
  return { entities, layerColors }
}

function dxfBBox (entities) {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity
  const consider = (x, y) => { if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y }
  for (const e of entities) {
    for (const [x, y] of e.pts) consider(x, y)
    if ((e.type === 'CIRCLE' || e.type === 'ARC') && e.pts[0] && e.size) {
      const [cx, cy] = e.pts[0]
      consider(cx - e.size, cy - e.size); consider(cx + e.size, cy + e.size)
    }
  }
  if (!isFinite(minX)) return { minX: 0, minY: 0, maxX: 100, maxY: 100 }
  return { minX, minY, maxX, maxY }
}

function drawDxfPage (entities, layerColors) {
  const bbox = dxfBBox(entities)
  const w = Math.max(bbox.maxX - bbox.minX, 1)
  const h = Math.max(bbox.maxY - bbox.minY, 1)
  const PAD = 40
  const CW = 1600
  const CH = Math.round(CW * (h / w)) || 1131
  const canvas = document.createElement('canvas')
  canvas.width = CW
  canvas.height = CH
  const ctx = canvas.getContext('2d')
  ctx.fillStyle = '#ffffff'
  ctx.fillRect(0, 0, CW, CH)

  const scale = Math.min((CW - PAD * 2) / w, (CH - PAD * 2) / h)
  const ox = PAD + (CW - PAD * 2 - w * scale) / 2 - bbox.minX * scale
  const oy = CH - (PAD + (CH - PAD * 2 - h * scale) / 2) + bbox.minY * scale // DXF is Y-up, canvas is Y-down
  const tx = (x) => ox + x * scale
  const ty = (y) => oy - y * scale

  for (const e of entities) {
    // BYLAYER: an entity with no explicit group-62 color (the common case —
    // real DXF exports default to it) takes its layer's color from the
    // TABLES section instead of a flat default.
    const aci = e.color != null ? e.color : (layerColors || {})[e.layer]
    const color = ACI_COLORS[aci] || DXF_DEFAULT_STROKE
    ctx.strokeStyle = color
    ctx.fillStyle = color
    ctx.lineWidth = e.layer === 'СТЕНЫ' ? 2.5 : 1
    if (e.type === 'LINE' && e.pts.length >= 2) {
      ctx.beginPath()
      ctx.moveTo(tx(e.pts[0][0]), ty(e.pts[0][1]))
      ctx.lineTo(tx(e.pts[1][0]), ty(e.pts[1][1]))
      ctx.stroke()
    } else if ((e.type === 'LWPOLYLINE' || e.type === 'POLYLINE') && e.pts.length >= 2) {
      ctx.beginPath()
      ctx.moveTo(tx(e.pts[0][0]), ty(e.pts[0][1]))
      for (let i = 1; i < e.pts.length; i++) ctx.lineTo(tx(e.pts[i][0]), ty(e.pts[i][1]))
      ctx.stroke()
    } else if (e.type === 'CIRCLE' && e.pts[0] && e.size) {
      ctx.beginPath()
      ctx.arc(tx(e.pts[0][0]), ty(e.pts[0][1]), e.size * scale, 0, Math.PI * 2)
      ctx.stroke()
    } else if (e.type === 'ARC' && e.pts[0] && e.size != null) {
      const a0 = -(e.startAngle || 0) * Math.PI / 180
      const a1 = -(e.endAngle || 0) * Math.PI / 180
      ctx.beginPath()
      ctx.arc(tx(e.pts[0][0]), ty(e.pts[0][1]), Math.max(e.size, 0.01) * scale, a0, a1, true)
      ctx.stroke()
    } else if ((e.type === 'TEXT' || e.type === 'MTEXT') && e.pts[0] && e.text) {
      const size = Math.max((e.size || 2.5) * scale, 9)
      ctx.font = size + 'px sans-serif'
      ctx.fillText(e.text, tx(e.pts[0][0]), ty(e.pts[0][1]))
    }
  }
  return canvas
}

async function renderDxfPages (side) {
  const res = await fetch(`/api/file?${qs}&side=${side}`)
  if (!res.ok) throw new Error('не удалось получить файл (' + res.status + ')')
  const src = await res.text()
  const { entities, layerColors } = parseDxfEntities(src)
  if (!entities.length) return { images: [], texts: [] }
  const canvas = drawDxfPage(entities, layerColors)
  return { images: [canvas.toDataURL('image/jpeg', 0.92)], texts: [extractDxfText(src)] }
}

async function loadSide (side, hasFile) {
  if (!hasFile) return { supported: false, kind: 'other', pageCount: 0, images: null, texts: null }
  let info
  try {
    info = await getJSON(`/api/pages?${qs}&side=${side}`)
  } catch (e) {
    return { supported: false, kind: 'other', pageCount: 0, images: null, texts: null }
  }
  if (info.kind === 'docx') {
    try {
      const { images, texts } = await renderDocxPages(side)
      info.images = images
      info.texts = texts
      info.pageCount = images.length
      if (!images.length) { info.supported = false; info.kind = 'other' }
    } catch (e) {
      console.error('docx render failed for side=' + side, e)
      info.supported = false
      info.kind = 'other'
    }
  } else if (info.kind === 'dxf') {
    try {
      const { images, texts } = await renderDxfPages(side)
      info.images = images
      info.texts = texts
      info.pageCount = images.length
      if (!images.length) { info.supported = false; info.kind = 'other' }
    } catch (e) {
      console.error('dxf render failed for side=' + side, e)
      info.supported = false
      info.kind = 'other'
    }
  } else if (info.kind === 'pdf') {
    // Page-image fetching for PDF stays lazy (/api/page, per view), but text
    // is cheap and cached server-side, so just fetch it eagerly here — the
    // "text" view mode needs it and there's no per-page round trip to avoid.
    try {
      const t = await getJSON(`/api/text?${qs}&side=${side}`)
      info.texts = t.pages || []
    } catch (e) {
      console.error('pdftotext failed for side=' + side, e)
      info.texts = []
    }
  }
  return info
}

// Resolves one page's image source regardless of whether it came from the
// server (PDF, fetched on demand) or was rendered client-side (DOCX, already
// a data: URL in memory).
function pageSrc (info, side, n) {
  if (!info) return ''
  if (info.kind === 'pdf') return `/api/page?${qs}&side=${side}&n=${n}`
  if ((info.kind === 'docx' || info.kind === 'dxf') && info.images) return info.images[n - 1] || ''
  return ''
}

// Resolves one page's extracted text, regardless of source (server-side
// pdftotext for PDF, docx-preview's own DOM for DOCX).
function pageText (info, n) {
  if (!info || !info.texts) return ''
  return info.texts[n - 1] || ''
}

// Generic LCS diff (classic O(n*m) table — page-sized input, so this is
// milliseconds even for a couple thousand tokens) over two arrays of
// already-tokenized items, compared by === . Used both at line granularity
// (the git-diff-style page view) and, within one changed line pair, at word
// granularity (see wordDiffSpans).
function diffSeq (a, b) {
  const n = a.length, m = b.length
  const dp = new Array(n + 1)
  for (let i = 0; i <= n; i++) dp[i] = new Uint32Array(m + 1)
  for (let i = n - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) {
      dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1])
    }
  }
  const ops = []
  let i = 0, j = 0
  while (i < n && j < m) {
    if (a[i] === b[j]) { ops.push({ type: 'equal', text: a[i] }); i++; j++ }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { ops.push({ type: 'del', text: a[i] }); i++ }
    else { ops.push({ type: 'add', text: b[j] }); j++ }
  }
  while (i < n) { ops.push({ type: 'del', text: a[i] }); i++ }
  while (j < m) { ops.push({ type: 'add', text: b[j] }); j++ }
  return ops
}

// Splits page text into comparable lines: pdftotext -layout gives PDF pages
// real line breaks; linesFromElement() gives DOCX pages one line per
// paragraph/row (see above). Internal whitespace runs are collapsed per
// line — same rationale as the old word-diff had: the two extraction
// pipelines produce very different incidental spacing for identical
// wording, so a highlight should track real content changes, not that.
// Runs of 2+ blank lines collapse to one, so pdftotext's spacing blank
// lines don't inflate the diff with noise docx never had.
function textLines (text) {
  const raw = (text || '').split(/\r?\n/).map(l => l.replace(/\s+/g, ' ').trim())
  const out = []
  for (const l of raw) {
    if (l === '' && out[out.length - 1] === '') continue
    out.push(l)
  }
  while (out.length && out[0] === '') out.shift()
  while (out.length && out[out.length - 1] === '') out.pop()
  return out
}

// Word-level ops for one changed line pair, as spans to insert inside that
// line's row — lets a one-line edit ("2.4 м" → "2.6 м") show exactly which
// words changed instead of tinting the whole line, same as GitHub/GitLab's
// intra-line diff highlighting.
function wordDiffSpans (delText, addText) {
  const ops = diffSeq(delText.split(/\s+/).filter(Boolean), addText.split(/\s+/).filter(Boolean))
  const delSpans = [], addSpans = []
  for (const op of ops) {
    if (op.type === 'equal') { delSpans.push({ t: op.text, hi: false }); addSpans.push({ t: op.text, hi: false }) }
    else if (op.type === 'del') delSpans.push({ t: op.text, hi: true })
    else addSpans.push({ t: op.text, hi: true })
  }
  return { delSpans, addSpans }
}

function lineRow (kind, marker, text) {
  return el('div', { class: 'tdiff-row ' + kind }, [
    el('span', { class: 'marker', text: marker }),
    el('span', { class: 'content', text: text || ' ' }),
  ])
}

// Same as lineRow but with word-level highlight spans inside .content
// instead of plain text — used for a 1:1 changed-line pair.
function lineRowHi (kind, marker, spans) {
  const content = el('span', { class: 'content' })
  spans.forEach((s, idx) => {
    if (idx > 0) content.appendChild(document.createTextNode(' '))
    const node = s.hi ? el('span', { class: kind === 'del' ? 'tdiff-del' : 'tdiff-add', text: s.t }) : document.createTextNode(s.t)
    content.appendChild(node)
  })
  return el('div', { class: 'tdiff-row ' + kind }, [el('span', { class: 'marker', text: marker }), content])
}

const DIFF_CONTEXT = 3 // unchanged lines kept visible around each change, like `git diff -U3`
let foldState = {} // "<page>:<blockIndex>" -> true once a fold's been expanded by the user

// Groups line-level diff ops into alternating context/change blocks, the
// same shape a unified diff's hunks have: a run of untouched lines, then a
// run of removed lines followed by added lines, and so on.
function buildBlocks (ops) {
  const blocks = []
  let i = 0
  while (i < ops.length) {
    if (ops[i].type === 'equal') {
      const lines = []
      while (i < ops.length && ops[i].type === 'equal') { lines.push(ops[i].text); i++ }
      blocks.push({ kind: 'ctx', lines })
    } else {
      const dels = [], adds = []
      while (i < ops.length && ops[i].type !== 'equal') {
        if (ops[i].type === 'del') dels.push(ops[i].text)
        else adds.push(ops[i].text)
        i++
      }
      blocks.push({ kind: 'change', dels, adds })
    }
  }
  return blocks
}

async function getJSON (url) {
  const res = await fetch(url)
  const data = await res.json().catch(() => ({}))
  if (!res.ok || data.error) throw new Error(data.error || res.statusText)
  return data
}

function el (tag, attrs, children) {
  const e = document.createElement(tag)
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') e.className = v
    else if (k === 'text') e.textContent = v
    else e.setAttribute(k, v)
  }
  for (const c of children || []) if (c) e.appendChild(c)
  return e
}

// Only place we need raw markup (inline SVG icons) — el() stays text-safe
// for everything that comes from server data.
function iconEl (svg, cls) {
  const span = document.createElement('span')
  if (cls) span.className = cls
  span.innerHTML = svg
  return span
}

let pollTimer = null

async function main () {
  const app = document.getElementById('app')
  if (!recordID || !namespaceID) {
    app.innerHTML = ''
    app.appendChild(el('div', { class: 'err', text: 'Не переданы recordID/namespaceID.' }))
    return
  }

  let comparison
  try {
    comparison = await getJSON(`/api/comparison?${qs}`)
  } catch (e) {
    app.innerHTML = ''
    app.appendChild(el('div', { class: 'err', text: 'Не удалось загрузить сравнение: ' + e.message }))
    return
  }

  const [pd, rd] = await Promise.allSettled([
    loadSide('pd', comparison.hasPdFile),
    loadSide('rd', comparison.hasRdFile),
  ])
  pdPages = pd.status === 'fulfilled' ? pd.value : { supported: false, kind: 'other', pageCount: 0, images: null, texts: null }
  rdPages = rd.status === 'fulfilled' ? rd.value : { supported: false, kind: 'other', pageCount: 0, images: null, texts: null }

  render(comparison)
  schedulePoll(comparison)
}

// The agent's own analysis chain takes minutes on CPU-only inference — while
// it's running, poll the lightweight /api/comparison endpoint (no page
// images) rather than making the user reload by hand. Once the status
// leaves new/processing, the pages/attachments may have changed too, so a
// full reload picks those up cleanly instead of reconciling state in place.
function schedulePoll (comparison) {
  clearTimeout(pollTimer)
  if (comparison.status !== 'new' && comparison.status !== 'processing') return
  pollTimer = setTimeout(async () => {
    let next
    try {
      next = await getJSON(`/api/comparison?${qs}`)
    } catch (e) {
      schedulePoll(comparison)
      return
    }
    if (next.status !== comparison.status) {
      location.reload()
      return
    }
    render(next)
    schedulePoll(next)
  }, 4000)
}

let lastComparison = null

function render (comparison) {
  lastComparison = comparison
  const app = document.getElementById('app')
  app.innerHTML = ''

  const statusCls = STATUS_CLASS[comparison.status] || ''
  const spinning = comparison.status === 'processing'
  app.appendChild(el('div', { class: 'head' }, [
    el('h1', { text: comparison.title || ('Сравнение #' + recordID) }),
    el('span', { class: 'badge ' + statusCls }, [
      iconEl(STATUS_ICON[comparison.status] || '•', spinning ? 'spin' : ''),
      document.createTextNode(STATUS_LABEL[comparison.status] || comparison.status || '—'),
    ]),
  ]))

  if (comparison.pdFileName || comparison.rdFileName) {
    app.appendChild(el('div', { class: 'files' }, [
      comparison.pdFileName ? el('span', {}, [document.createTextNode('ПД: '), el('b', { text: comparison.pdFileName })]) : null,
      comparison.rdFileName ? el('span', {}, [document.createTextNode('РД: '), el('b', { text: comparison.rdFileName })]) : null,
    ]))
  }

  if (comparison.similarityPercent) {
    const pct = Math.max(0, Math.min(100, Number(comparison.similarityPercent) || 0))
    const barColor = pct >= 80 ? 'var(--ok)' : pct >= 50 ? 'var(--warn)' : 'var(--bad)'
    const fill = el('div', {})
    fill.style.cssText = `width:${pct}%; background:${barColor};`
    app.appendChild(el('div', { class: 'simbar-row' }, [
      el('span', { class: 'simlabel', text: 'Схожесть' }),
      el('div', { class: 'simbar' }, [fill]),
      el('span', { class: 'simlabel', text: pct + '%' }),
    ]))
  }

  if (comparison.comment) app.appendChild(el('div', { class: 'comment', text: comparison.comment }))

  const bothSupported = pdPages.supported && rdPages.supported
  const pageCount = Math.max(pdPages.pageCount || 0, rdPages.pageCount || 0)

  if (bothSupported && pageCount > 0) {
    app.appendChild(buildViewer(pageCount))
  } else {
    app.appendChild(el('div', { class: 'unsupported' }, [
      el('div', { text: 'Визуальное постраничное наложение доступно для PDF, DOCX и DXF.' }),
      el('div', { text: (comparison.hasPdFile && !pdPages.supported) || (comparison.hasRdFile && !rdPages.supported)
        ? 'Один из файлов не удалось отобразить постранично, показан только текстовый список расхождений ниже.'
        : 'Файлы ещё не загружены.' }),
    ]))
  }

  app.appendChild(buildDiscrepancies(comparison.discrepancies || [], bothSupported ? pageCount : 0))
}

function buildViewer (pageCount) {
  if (page > pageCount) page = pageCount
  if (page < 1) page = 1

  const container = el('div', {})

  const modes = el('div', { class: 'modes' }, [
    modeBtn('side'), modeBtn('overlay'), modeBtn('diff'),
    el('span', { class: 'mode-sep' }),
    modeBtn('text'),
  ])
  container.appendChild(modes)
  container.appendChild(el('div', { class: 'mode-hint', text: MODE_META[mode].hint }))

  const toolbarRow = el('div', { class: 'toolbar-row' })
  const pager = el('div', { class: 'pager' }, [
    el('button', { text: '‹ Пред.' }),
    el('span', { text: `Стр. ${page} / ${pageCount}` }),
    el('button', { text: 'След. ›' }),
  ])
  pager.children[0].disabled = page <= 1
  pager.children[2].disabled = page >= pageCount
  pager.children[0].onclick = () => { page--; rerender() }
  pager.children[2].onclick = () => { page++; rerender() }
  toolbarRow.appendChild(pager)

  if (mode !== 'text') toolbarRow.appendChild(buildZoomControls())
  container.appendChild(toolbarRow)

  const pdUrl = pageSrc(pdPages, 'pd', page)
  const rdUrl = pageSrc(rdPages, 'rd', page)
  const zoomPct = ZOOM_LEVELS[zoomIdx]
  const applyZoom = (img) => {
    if (zoomPct === 100) return
    img.style.maxWidth = 'none'
    img.style.width = zoomPct + '%'
  }

  if (mode === 'side') {
    const pdImg = el('img', { src: pdUrl, alt: 'ПД' })
    const rdImg = el('img', { src: rdUrl, alt: 'РД' })
    applyZoom(pdImg); applyZoom(rdImg)
    container.appendChild(el('div', { class: 'stage side-by-side' }, [
      el('div', { class: 'col' }, [el('div', { class: 'label', text: pdLabel() }), pdImg]),
      el('div', { class: 'col' }, [el('div', { class: 'label', text: rdLabel() }), rdImg]),
    ]))
  } else if (mode === 'overlay') {
    const bottom = el('img', { src: pdUrl, alt: 'ПД' })
    const top = el('img', { class: 'top', src: rdUrl, alt: 'РД' })
    applyZoom(bottom); applyZoom(top)
    top.style.opacity = '0.5'
    container.appendChild(el('div', { class: 'opacity-row' }, [
      el('span', { text: 'Прозрачность РД поверх ПД:' }),
      (() => {
        const input = el('input', { type: 'range', min: '0', max: '100', value: '50' })
        input.oninput = () => { top.style.opacity = String(input.value / 100) }
        return input
      })(),
    ]))
    container.appendChild(el('div', { class: 'stage overlay-stage' }, [bottom, top]))
  } else if (mode === 'diff') {
    const bottom = el('img', { src: pdUrl, alt: 'ПД' })
    const top = el('img', { class: 'top', src: rdUrl, alt: 'РД' })
    applyZoom(bottom); applyZoom(top)
    container.appendChild(el('div', { class: 'stage diff-stage' }, [bottom, top]))
  } else if (mode === 'text') {
    container.appendChild(buildTextDiff(page))
  }

  function modeBtn (key) {
    const meta = MODE_META[key]
    const b = el('button', { class: mode === key ? 'active' : '' }, [iconEl(ICONS[key]), document.createTextNode(meta.label)])
    b.onclick = () => { mode = key; rerender() }
    return b
  }

  function buildZoomControls () {
    const minus = el('button', { text: '−' })
    const plus = el('button', { text: '+' })
    const levelLabel = el('span', { class: 'zlevel', text: ZOOM_LEVELS[zoomIdx] + '%' })
    minus.disabled = zoomIdx <= 0
    plus.disabled = zoomIdx >= ZOOM_LEVELS.length - 1
    minus.onclick = () => { if (zoomIdx > 0) { zoomIdx--; rerender() } }
    plus.onclick = () => { if (zoomIdx < ZOOM_LEVELS.length - 1) { zoomIdx++; rerender() } }
    const reset = el('button', { text: 'Сброс' })
    reset.onclick = () => { zoomIdx = ZOOM_LEVELS.indexOf(100); rerender() }
    return el('div', { class: 'zoom' }, [minus, levelLabel, plus, reset])
  }

  return container
}

function pdLabel () { return lastComparison && lastComparison.pdFileName ? 'ПД — ' + lastComparison.pdFileName : 'ПД' }
function rdLabel () { return lastComparison && lastComparison.rdFileName ? 'РД — ' + lastComparison.rdFileName : 'РД' }

// Unified, git-diff-style page text: PD is "a", RD is "b", removed lines get
// a red "−" row, added lines a green "+" row, matching lines are dimmed
// context — same layout `git diff`/GitHub give two versions of a source
// file. Long unchanged stretches collapse behind a click-to-expand fold
// (like `git diff -U3`), and a clean 1:1 line replacement gets word-level
// highlighting inside the row instead of a flat color (see wordDiffSpans).
function buildTextDiff (n) {
  const container = el('div', {})
  container.appendChild(el('div', { class: 'text-legend' }, [
    el('span', {}, [el('span', { class: 'swatch del' }), document.createTextNode('только в ПД')]),
    el('span', {}, [el('span', { class: 'swatch add' }), document.createTextNode('только в РД')]),
  ]))

  const pdText = pageText(pdPages, n)
  const rdText = pageText(rdPages, n)
  if (!pdText && !rdText) {
    container.appendChild(el('div', { class: 'empty', text: 'На этой странице нет извлечённого текста ни в одном из файлов.' }))
    return container
  }

  const pdLines = textLines(pdText)
  const rdLines = textLines(rdText)
  const ops = diffSeq(pdLines, rdLines)
  const blocks = buildBlocks(ops)
  const box = el('div', { class: 'text-diff' })

  if (blocks.length === 1 && blocks[0].kind === 'ctx') {
    box.appendChild(el('div', { class: 'tdiff-match', text: '✓ Текст страницы совпадает построчно.' }))
    container.appendChild(box)
    return container
  }

  blocks.forEach((block, blockIdx) => {
    if (block.kind === 'change') {
      // A clean 1:1 line-for-line substitution (same count on both sides,
      // most commonly exactly one) gets word-level highlighting per pair;
      // anything lumpier (added/removed whole lines) just gets flat rows —
      // still perfectly readable, it's what plain `git diff` shows too.
      const paired = block.dels.length === block.adds.length
      if (paired) {
        for (let k = 0; k < block.dels.length; k++) {
          const { delSpans, addSpans } = wordDiffSpans(block.dels[k], block.adds[k])
          box.appendChild(lineRowHi('del', '−', delSpans))
          box.appendChild(lineRowHi('add', '+', addSpans))
        }
      } else {
        for (const l of block.dels) box.appendChild(lineRow('del', '−', l))
        for (const l of block.adds) box.appendChild(lineRow('add', '+', l))
      }
      return
    }

    // Context block: show up to DIFF_CONTEXT lines at each edge that
    // actually borders a change (the very first/last block only borders a
    // change on one side), folding away a longer untouched middle behind a
    // click-to-expand toggle.
    const isFirst = blockIdx === 0
    const isLast = blockIdx === blocks.length - 1
    const headN = isFirst ? 0 : DIFF_CONTEXT
    const tailN = isLast ? 0 : DIFF_CONTEXT
    const foldKey = page + ':' + blockIdx
    const expanded = foldState[foldKey]
    const hiddenCount = block.lines.length - headN - tailN

    if (expanded || hiddenCount <= 0) {
      for (const l of block.lines) box.appendChild(lineRow('ctx', ' ', l))
      return
    }
    for (const l of block.lines.slice(0, headN)) box.appendChild(lineRow('ctx', ' ', l))
    const fold = el('div', { class: 'tdiff-fold', text: `⋯ ${hiddenCount} совпадающих строк без изменений — показать ⋯` })
    fold.onclick = () => { foldState[foldKey] = true; rerender() }
    box.appendChild(fold)
    for (const l of block.lines.slice(block.lines.length - tailN)) box.appendChild(lineRow('ctx', ' ', l))
  })

  container.appendChild(box)
  return container
}

function rerender () {
  if (lastComparison) render(lastComparison)
}

// The rule chain bakes its finding source into the description text itself
// as a "[ИИ] "/"[детерм.] " prefix (chains.mjs, compareChain finalize) —
// there's no separate field for it. Pull it back out here so it renders as
// a real tag instead of leading text the eye has to parse every time.
function splitSource (description) {
  const text = description || ''
  if (text.startsWith('[ИИ] ')) return { source: 'ai', text: text.slice(5) }
  if (text.startsWith('[детерм.] ')) return { source: 'det', text: text.slice(10) }
  return { source: null, text }
}

// Jumps the page viewer to a discrepancy's page and scrolls it into view —
// called from a discrepancy row click (see buildDiscrepancies).
function jumpToPage (n) {
  page = n
  rerender()
  const target = document.querySelector('.stage, .text-diff')
  if (target) target.scrollIntoView({ behavior: 'smooth', block: 'center' })
}

function buildDiscrepancies (list, pageCount) {
  const box = el('div', { class: 'discrepancies' }, [
    el('h2', { text: `Расхождения (${list.length})` }),
  ])
  if (!list.length) {
    box.appendChild(el('div', { class: 'empty', text: 'Расхождений не найдено.' }))
    return box
  }

  const counts = { high: 0, medium: 0, low: 0 }
  for (const d of list) if (counts[d.severity] != null) counts[d.severity]++
  const summary = el('div', { class: 'disc-summary' })
  for (const sev of ['high', 'medium', 'low']) {
    if (!counts[sev]) continue
    summary.appendChild(el('span', { class: 'chip ' + sev }, [
      el('span', { class: 'dot' }),
      document.createTextNode(`${SEV_LABEL[sev]}: ${counts[sev]}`),
    ]))
  }
  box.appendChild(summary)

  const sorted = list.slice().sort((a, b) => (SEV_ORDER[a.severity] ?? 9) - (SEV_ORDER[b.severity] ?? 9))
  for (const d of sorted) {
    const { source, text } = splitSource(d.description)
    const typeLabel = d.type && TYPE_LABEL[d.type] ? TYPE_LABEL[d.type] : null
    const hasText = !!text.trim()
    // Some discrepancies (demo/seed data, or a check that only flags a page
    // without generating wording) carry no description at all — rendering
    // an empty row reads as broken. Fall back to naming the type instead of
    // showing nothing, and say plainly that there's no further detail.
    const primaryText = hasText ? text : (typeLabel ? `Расхождение: ${typeLabel}` : 'Расхождение без описания')

    // A page number is only trustworthy if it's actually inside the
    // rendered preview — a check can flag a page the viewer never loaded
    // (fewer real pages than expected, a fetch that came back short, …).
    // Rendering it exactly like a working "стр. N" link in that case reads
    // as a broken reference rather than what it is: informational only.
    const n = Number(d.pageNumber)
    const hasPage = !!d.pageNumber
    const pageAvailable = pageCount > 0 && n >= 1 && n <= pageCount
    const pageTag = hasPage
      ? el('span', {
          class: 'tag tag-page' + (pageAvailable ? '' : ' tag-page-unavailable'),
          text: 'стр. ' + d.pageNumber + (pageAvailable ? '' : ' ⚠'),
          title: pageAvailable ? 'Открыть страницу ' + d.pageNumber : `Страницы ${d.pageNumber} нет в загруженном предпросмотре (доступно страниц: ${pageCount || 0})`,
        })
      : null

    const tags = el('div', { class: 'tags' }, [
      source ? el('span', { class: 'tag ' + (source === 'ai' ? 'src-ai' : ''), text: source === 'ai' ? '🤖 ИИ' : '⚙ детерминированно' }) : null,
      typeLabel ? el('span', { class: 'tag', text: typeLabel }) : null,
      pageTag,
    ])
    const body = [tags, el('span', { class: hasText ? '' : 'disc-fallback', text: primaryText })]
    if (!hasText) {
      let note = 'Автоматическая проверка не добавила текстовое описание.'
      if (hasPage) note += pageAvailable ? ' Откройте страницу, чтобы сравнить визуально.' : ' Указанной страницы нет в загруженном предпросмотре — визуальное сравнение недоступно.'
      body.push(el('div', { class: 'disc-note', text: note }))
    }

    const row = el('div', { class: 'disc' }, [
      el('span', { class: 'sev ' + (d.severity || ''), text: '● ' + (SEV_LABEL[d.severity] || d.severity || '') }),
      el('div', { class: 'body' }, body),
    ])

    if (pageAvailable) {
      row.classList.add('clickable')
      row.title = 'Открыть страницу ' + n
      row.onclick = () => jumpToPage(n)
    }
    box.appendChild(row)
  }
  return box
}

main()
</script>
</body>
</html>
