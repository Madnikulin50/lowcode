        label: Среда
        kind: Select
        options:
          options:
            - prod
            - stage
            - dev
      mode:
        label: Режим
        kind: Select
        options:
          options:
            - monitor
            - enforce
      status:
        label: Статус
        kind: Select
        options:
          options:
            - pending
            - connected
            - error
            - disabled
