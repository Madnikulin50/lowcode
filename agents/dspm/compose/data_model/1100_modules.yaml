namespace: dspm
modules:
  connectors:
    name: Коннекторы
    fields:
      name:
        label: Название
        kind: String
        required: true
      kind:
        label: Тип
        kind: Select
        options:
          options:
            - cloud
            - saas
            - database
            - warehouse
            - lake
            - fileshare
            - idp
      provider:
        label: Провайдер
        kind: String
