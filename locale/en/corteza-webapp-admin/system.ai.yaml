  ollamaURLPlaceholder: http://127.0.0.1:11434
  ollamaURLHelp: Leave empty to use OLLAMA_URL, then OLLAMA_HOST, then localhost.
  ollamaURLEffective: "Currently using {url} (from {source})"
  save: Save changes
  saved: Saved
  roles:
    title: Default model by purpose
    help: Each purpose uses its own default. Empty = CHAT_MODEL env or built-in default (qwen3:8b).
    fallback: (env / built-in default)
