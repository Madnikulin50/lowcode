primary:
  title: Основная база данных
  name: Имя
  handle: Дескриптор
  location: Расположение
  ownership: Владение
  sensitivity-level: Уровень чувствительности

list:
  title: Список подключений к БД
  add-button: Новое подключение
  loading: Загрузка подключений
  filterForm:
    deleted:
      label: удалённые подключения
    excluded:
      label: Без
    exclusive:
      label: Только
    inclusive:
      label: Включая
  columns:
    name: Имя
    location: Расположение
    ownership: Владение
    createdAt: Создано
    actions: ''
  delete: Удалить
  undelete: Восстановить

editor:
  title:
    edit: Изменить подключение
    create: Новое подключение
  basic:
    title: Основные настройки
    form:
      name:
        label: Имя *
        placeholder: Озеро данных
        description: ''
      handle:
        label: Дескриптор
        placeholder: упрощённое_имя_подключения
        invalid-characters: Должен быть не менее 2 символов. Может содержать только буквы, цифры, подчёркивания и точки. Должен заканчиваться буквой или цифрой
      location-name:
        label: Название расположения
        placeholder: Название места хранения данных
        description: Название города, страны, континента и т.д.
      location-geometry:
        label: Координаты расположения
        description: Координаты места хранения данных
      ownership:
        label: Владение
        placeholder: ООО Компания
        description: Название компании или лица, владеющего данными
      sensitivity-level:
        label: Максимально допустимый уровень чувствительности
        placeholder: Выберите уровень чувствительности
        description: Максимально допустимый уровень чувствительности для хранимых данных (задаётся в полях модуля, использующего это подключение)

  properties:
    title: Свойства подключения и базы данных
    form:
      data-at-rest-encryption:
        checkbox:
          label: Шифрование данных при хранении включено
        notes:
          label: Примечания о шифровании
          description: Внутренние примечания о шифровании данных при хранении (дисковое шифрование)
      data-at-rest-protection:
        checkbox:
          label: Обеспечена защита данных при хранении
        notes:
          label: Примечания о защите данных при хранении
          description: Внутренние примечания о защите данных при хранении (физическая защита)
      data-at-transit-encryption:
        checkbox:
          label: Шифрование данных при передаче включено
        notes:
          label: Примечания о шифровании данных при передаче
          description: Внутренние примечания о шифровании данных при передаче (сетевое шифрование)
      data-restoration:
        checkbox:
          label: Реализовано резервное копирование и восстановление данных
        notes:
          label: Примечания о восстановлении данных
          description: Внутренние примечания о восстановлении данных

  dal:
    title: Конфигурация слоя доступа к данным и параметры подключения
    form:
      model-ident:
        label: Имя таблицы или контейнера по умолчанию
        placeholder: compose_record
        description: |
          Идентификатор может содержать плейсхолдеры, такие как {{module}} (заменяется на дескриптор модуля) и/или {{namespace}} (заменяется на дескриптор пространства).
          Если задано, используется по умолчанию для модулей без настроенного идентификатора.

      type:
        label: Тип подключения и параметров
        placeholder: corteza::dal:connection:dsn
        description: Тип подключения и параметров, например corteza::dal:connection:dsn

      params:
        label: Параметры подключения
        placeholder: postgres://user:pass@host:port/dbname
        description: 'Параметры подключения, например: {"dsn": "postgres://user:pass@host:port/dbname"}'

    connectivity-issues: Проблемы с подключением
    no-access-warning: Нет прав на управление конфигурацией слоя доступа к данным и параметрами подключения для этого соединения
