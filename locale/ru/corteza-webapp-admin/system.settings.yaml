editor:
  title: Системные настройки
  auth:
    title: Аутентификация
    url: URL
    internal:
      title: Внутренняя
      enabled: Внутренняя аутентификация включена
      password-reset:
        enabled: Сброс пароля включён
      password-constraints:
        title: Ограничения пароля
        ignored-security: Система настроена игнорировать ограничения безопасности паролей, что небезопасно для production. Если это production, обратитесь к администратору для обновления конфигурации (переменная AUTH_PASSWORD_SECURITY в .env).
        min-length: Минимальная длина
        min-length-description: Должен быть не менее 8 символов
        min-num-count: Минимальное количество цифр
        min-num-count-description: Пароль должен содержать указанное количество цифр (отключено при 0)
        min-special-count: Минимальное количество спецсимволов
        min-special-count-description: Пароль должен содержать указанное количество спецсимволов (отключено при 0)
        min-upper-case-length: Минимальное количество заглавных букв
        min-upper-case-description: Пароль должен содержать указанное количество заглавных букв (отключено при 0)
        min-lower-case-length: Минимальное количество строчных букв
        min-lower-case-description: Пароль должен содержать указанное количество строчных букв (отключено при 0)
      signup:
        email-confirmation-required: Подтверждение email при регистрации обязательно
        enabled: Регистрация включена
        split-credentials-check:
          description: 'Разделить вход на два шага: сначала запросить email, затем показать поле пароля на втором экране. Автоматически перенаправить пользователя на внешнего провайдера, если у пользователя не задан пароль и доступен только один IdP'
          label: Включить раздельную проверку учётных данных
      profile-avatar:
        enabled: Аватар профиля включён
      send-user-invite-email:
        title: Пригласительное письмо
        enabled: Отправлять приглашение при создании пользователя
        description: При включении отправляет пригласительное письмо новому пользователю, созданному через CLI
        expires:
          label: Действителен в течение
          description: Как долго токен приглашения действителен до истечения
    mail:
      title: Отправитель писем аутентификации
      from-address: Адрес отправителя
      from-name: Имя отправителя
      validate-email: Введите корректный адрес почты
    mfa:
      title: Многофакторная аутентификация
      TOTP:
        enabled: Включить TOTP (одноразовый пароль через мобильное приложение)
        enforced: Требовать TOTP для всех пользователей
        issuer:
          description: Имя издателя будет отправлено в приложение-аутентификатор при настройке пользователем
          label: Издатель
      emailOTP:
        enabled: Включить Email OTP (одноразовый пароль по почте)
        enforced: Требовать Email OTP для всех пользователей
        expires:
          description: Как долго пароль действителен до истечения
          label: Действителен в течение
    auto-logout:
      title: Автовыход
      enabled:
        label: Включено
        description: Автоматически выходить из системы после периода бездействия
      timeout:
        label: Таймаут
        description: Период бездействия в секундах перед выходом пользователя

  external:
    title: Внешние провайдеры аутентификации
    enabled: Включить внешнюю аутентификацию

    table:
      header:
        enabled: Включено
        provider: Провайдер
        info: Издатель, client ID

    standard:
      enabled: Включено
      apiAccess: Доступ к API
      clientKey: Client key
      clientSecret: Секрет

    oidc:
      add: Добавить OIDC провайдера
      enabled: Включено
      handle: Дескриптор
      title: OpenID Connect
      issuer: OIDC Issuer URL
      issuerHint: Где найти /.well-known/openid-configuration (без части /.well-known/openid-configuration)
      clientKey: Client key
      clientSecret: Секрет
      scope: Scope
      scopePlaceholder: Перечислите поддерживаемые значения OAuth scope
      scopeHint: Используйте строку с разделителем-пробелом

    saml:
      enabled: Включено
      title: SAML
      requests:
        title: Запросы
        sign-requests: Подписывать запросы
        sign-method: Метод подписи
        binding: Привязка
        binding-redirect: HTTP Redirect
        binding-post: HTTP POST
      cert:
        public: Публичный ключ
        private: Приватный ключ
      name: Имя
      certificate: Сертификат
      idp:
        title: Провайдер идентификации
        ident-handle: Дескриптор поля
        ident-identifier: Идентификатор поля
        ident-name: Имя поля
        url: URL
      desc:
        name: Имя IdP на экране входа (Войти через <name>)
        cert:
          public: Содержимое будет минифицировано
          private: Содержимое будет минифицировано
        requests:
          sign-requests: Подписывать AuthNRequest и утверждение
          sign-method: Метод подписи запросов
          binding: Тип HTTP-привязки для AuthNRequest, по умолчанию HTTP Redirect (GET)
        idp:
          url: Расположение метаданных IdP
          ident-handle: Имя поля IdP для заполнения дескриптора или псевдонима пользователя Corteza
          ident-identifier: Имя поля IdP для заполнения и сопоставления email пользователя Corteza
          ident-name: Имя поля IdP для заполнения полного имени пользователя Corteza


    security:
      title: Безопасность
      prohibited-roles:
        description: Роли из этого списка будут удалены из контекста безопасности при аутентификации через этого провайдера
        label: Запрещённые роли
      forced-roles:
        description: Роли из этого списка будут всегда добавлены в контекст безопасности при аутентификации через этого провайдера
        label: Принудительные роли
      permitted-roles:
        description: Только роли из этого списка будут добавлены в контекст безопасности при аутентификации через этого провайдера
        label: Разрешённые роли

  bgScreen:
    title: Фон экрана авторизации

    image:
      uploader:
        label: Фоновое изображение

      editor:
        label: Пользовательский CSS
