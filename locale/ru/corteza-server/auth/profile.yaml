template:
  title: Your profile
  form:
    email:
      label: Почтовый адрес
      placeholder: email@domain.tld
      resend-confirmation-link: Почтовый адрес is not verified, <a data-test-id="link-resend-confirmation" href="{{link}}?resend">resend confirmation link.</a>
    name:
      label: Полное имя
      placeholder: Your full name
    handle:
      label: Дескриптор
      placeholder: Короткое имя, nickname or дескриптор
    avatar:
      label: Avatar
      delete: Delete
      upload: Upload avatar
    avatar-initial:
      label: Avatar initial
      color: Avatar text color
      background-color: Avatar background color
    preferred-language:
      label: Preferred language
    buttons:
      submit: Update profile
alerts:
  profile-updated: Профиль successfully updated
  profile-update-fail: Could not update profile due to input errors
  profile-avatar-uploaded: Профиль avatar successfully uploaded
  profile-avatar-deleted: Профиль avatar successfully deleted
