topics:
  compose:
    namespaces:
      list:
        title: Пространства
        hint: Выберите рабочее пространство, чтобы открыть его страницы
        body: |
          Пространство — это приложение: страницы, модули и графики живут здесь.

          - Откройте карточку, чтобы войти
          - **Управление** — создать, импортировать или отключить пространство
          - Подзаголовок и описание видны на карточке; иконка **?** открывает полную справку, если автор её написал
    namespace:
      edit:
        title: Редактирование пространства
        hint: Имя, оформление и справка для этого пространства
        body: |
          Задайте имя и короткий slug в URL, затем опишите пространство для пользователей.

          - **Подзаголовок** — одна строка (сайдбар и карточки)
          - **Описание** — краткое резюме на карточке
          - **Справка** — необязательный Markdown по иконке **?**
          - **ИИ-промпт** нужен только ассистенту, это не справка
    pages:
      list:
        title: Страницы
        hint: Дерево навигации этого пространства
        body: |
          Страницы — экраны, которые пользователь открывает из сайдбара.

          - Перетаскивайте страницы, чтобы менять порядок и вложенность
          - Страница может быть обычной или страницей записи модуля
          - **Конструктор** расставляет блоки (списки, графики, контент)
    page:
      edit:
        title: Редактирование страницы
        hint: Заголовок, видимость, описание и справка
        body: |
          Настройте, как страница выглядит в навигации.

          - **Описание** — краткое резюме рядом со справкой в шапке
          - **Справка** — необязательный Markdown для пользователей
          - Видимость и иконка управляют пунктом в сайдбаре
      builder:
        title: Конструктор страницы
        hint: Добавляйте и расставляйте блоки
        body: |
          Конструктор — сетка блоков.

          - **+** добавляет тип блока
          - Заголовок перетаскивает блок, угол меняет размер
          - У каждого блока свои заголовок и описание в конфигураторе
      view:
        title: Страница
        hint: Кнопка «Справка» на странице открывает описание этого экрана
        body: |
          Это живая страница пространства.

          - Полоска под заголовком — краткое описание экрана
          - **Справка** открывает полный текст по этой странице
          - Редакторы видят **Конструктор** и **Изменить** в шапке
    charts:
      list:
        title: Графики
        hint: Наглядные отчёты по записям модуля
        body: |
          График читает записи модуля и рисует метрики по измерениям.

          - Создайте график, затем поставьте его на страницу блоком «График»
          - Описание и справка графика видны пользователям на этом блоке
    chart:
      edit:
        title: Редактирование графика
        hint: Имя, описание, отчёты и справка
        body: |
          Выберите модуль, затем добавьте измерения (группировка) и метрики (значения).

          - **Описание** — краткое резюме на блоке графика
          - **Справка** — необязательный Markdown за иконкой **?**
          - Отчёты задают, что рисуется; панель инструментов добавляет экспорт и таблицу
