      connection:
        label: Соединение с БД
        placeholder: Выбрать соединение
        description: Changing the connection will reset the sensitivity level configuration on the module and fields, if the sensitivity level is incompatible with the new connection
      ident:
        label: Коллекция или имя БД
        placeholder: compose_record
        description: "Имя of the database table or collection where records can be accessed and stored. Supports partitioning placeholders: {{module}} for module handle and {{namespace}} for namespace handle"

      connections:
        fetch-failed: Could not fetch available connections


      module-fields:
        label: Module field mapping and encoding
        description: |
          Configure how record fields are stored and read from the database.
          Default behaviour is to encode values into JSON and store them in a single field.
          Alternatively you can use columns with the same name as the field name (Колонка)
          or use an Alias and store the value directly in the column.

      system-fields:
        label: System field mapping and encoding
        description: |
          System fields are used to store metadata about the record.
          Configure to skip or store them into a column with the same name (Колонка),
          a different column (Alias) or encode them into JSON.
        grouptypes:
          all: Все
          partition: Разделы
          userReference: Ссылки на пользователей
          timestamps: Временные метки
          extras: Дополнительные


      encoding-strategy:
        unavailable: unavailable
        ident:
          placeholder: Поле or database table column name

        strategies:
          plain:
